<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>밥투게더</title>
<script>
  // 예전에 공유된 order.html?id= 링크를 한 화면 구조(index.html?order=)로 옮긴다.
  (function () {
    var id = new URLSearchParams(location.search).get('id');
    location.replace('index.html' + (id ? '?order=' + encodeURIComponent(id) : ''));
  })();
</script>
</head>
<body>
<p><a href="index.html">밥투게더로 이동</a></p>
</body>
</html>
